name: Build Android APK
# 触发条件：推送main分支、手动在Actions页面点击运行
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest # 使用Ubuntu云环境打包
    steps:
      # 1.拉取项目源码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2.配置JDK（安卓编译固定jdk11）
      - name: Setup JDK11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle # 缓存依赖，加快打包

      # 3.赋予gradlew执行权限
      - name: Permission gradlew
        run: chmod +x gradlew

      # 4.编译Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5.上传APK到Artifacts（关键！页面底部下载由此生成）
      - name: Upload APK to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk # 你下载时显示的包名
          path: app/build/outputs/apk/debug/*.apk
